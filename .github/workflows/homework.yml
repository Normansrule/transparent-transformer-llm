name: homework
on:
  push:
    paths: ["classroom/exercises/**"]
  workflow_dispatch:
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: Grade the exercises (open this run's Summary page for the table)
        run: python classroom/check.py
