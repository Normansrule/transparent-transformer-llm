<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" width="960" height="382" role="img"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1B3F66" stroke-width="1"/></pattern></defs><rect width="960" height="382" rx="14" fill="#0F2A47"/><rect width="960" height="382" rx="14" fill="url(#g)" opacity="0.55"/><text x="28" y="34" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#7FA3C7" letter-spacing="0.4">frame 5  /  how much computing? four very different estimates</text><line x1="333" y1="84" x2="333" y2="316" stroke="#1B3F66"/><text x="332.9" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^10</text><line x1="399" y1="84" x2="399" y2="316" stroke="#1B3F66"/><text x="398.8" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^12</text><line x1="465" y1="84" x2="465" y2="316" stroke="#1B3F66"/><text x="464.7" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^14</text><line x1="531" y1="84" x2="531" y2="316" stroke="#1B3F66"/><text x="530.6" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^16</text><line x1="596" y1="84" x2="596" y2="316" stroke="#1B3F66"/><text x="596.5" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^18</text><line x1="662" y1="84" x2="662" y2="316" stroke="#1B3F66"/><text x="662.4" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^20</text><line x1="728" y1="84" x2="728" y2="316" stroke="#1B3F66"/><text x="728.2" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^22</text><line x1="794" y1="84" x2="794" y2="316" stroke="#1B3F66"/><text x="794.1" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^24</text><line x1="860" y1="84" x2="860" y2="316" stroke="#1B3F66"/><text x="860.0" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7FA3C7" text-anchor="middle" font-weight="400" xml:space="preserve" >10^26</text><text x="288.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#DCE9F5" text-anchor="end" font-weight="400" xml:space="preserve" >a laptop processor</text><rect x="300" y="92" width="56" height="26" rx="4" fill="#5CC8FF"><animate attributeName="width" values="0;56;56" keyTimes="0;0.3;1" dur="7s" begin="0.0s" fill="freeze"/></rect><text x="300.0" y="134.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7FA3C7" text-anchor="start" font-weight="400" xml:space="preserve" >floating-point operations per second</text><text x="288.0" y="168.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#DCE9F5" text-anchor="end" font-weight="400" xml:space="preserve" >one datacenter GPU</text><rect x="300" y="150" width="198" height="26" rx="4" fill="#5CC8FF"><animate attributeName="width" values="0;198;198" keyTimes="0;0.3;1" dur="7s" begin="0.3s" fill="freeze"/></rect><text x="300.0" y="192.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7FA3C7" text-anchor="start" font-weight="400" xml:space="preserve" >operations per second, low precision</text><text x="288.0" y="226.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#DCE9F5" text-anchor="end" font-weight="400" xml:space="preserve" >the brain, counting synapses</text><rect x="300" y="208" width="217" height="26" rx="4" fill="#6FE3B4"><animate attributeName="width" values="0;217;217" keyTimes="0;0.3;1" dur="7s" begin="0.6s" fill="freeze"/></rect><text x="300.0" y="250.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7FA3C7" text-anchor="start" font-weight="400" xml:space="preserve" >bits per second (Moravec, cited in the 1990 paper)</text><text x="288.0" y="284.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#DCE9F5" text-anchor="end" font-weight="400" xml:space="preserve" >the brain, counting microtubules</text><rect x="300" y="266" width="494" height="26" rx="4" fill="#FFB238"><animate attributeName="width" values="0;494;494" keyTimes="0;0.3;1" dur="7s" begin="0.8999999999999999s" fill="freeze"/></rect><text x="300.0" y="308.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7FA3C7" text-anchor="start" font-weight="400" xml:space="preserve" >bits per second (Rasmussen, Hameroff et al. 1990: 10²³ to 10²⁵)</text><text x="40.0" y="70.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7FA3C7" text-anchor="start" font-weight="400" xml:space="preserve" >rough estimates in different units: read them as orders of magnitude, not as a race</text></svg>