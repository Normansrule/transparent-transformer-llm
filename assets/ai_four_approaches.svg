 >do the best expected thing:</text><text x="610.0" y="319.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7FA3C7" text-anchor="start" font-weight="400" xml:space="preserve" >AIMA, and this repository</text><text x="40.0" y="380.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7FA3C7" text-anchor="start" font-weight="400" xml:space="preserve" >Language models imitate human text (acting humanly). Wrapped in a harness and measured, they become rational agents.</text></svg>