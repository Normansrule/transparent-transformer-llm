<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1B3F66" stroke-width="1"/></pattern></defs><rect width="960" height="350" rx="14" fill="#0F2A47"/><rect width="960" height="350" rx="14" fill="url(#g)" opacity="0.55"/><text x="28" y="34" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#7FA3C7" letter-spacing="0.4">frame 6  /  AI at work in one industry</text><text x="150.0" y="140.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#DCE9F5" text-anchor="end" font-weight="700" xml:space="preserve" >2025</text><rect x="170" y="110" width="600" height="44" rx="8" fill="#143556" stroke="#1B3F66" stroke-width="1" /><rect x="170" y="110" width="306" height="44" rx="8" fill="#7FA3C7"><animate attributeName="width" values="0;306;306" keyTimes="0;0.35;1" dur="7s" begin="0.0s" fill="freeze"/></rect><text x="496.0" y="140.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#DCE9F5" text-anchor="start" font-weight="700" xml:space="preserve" >51%</text><text x="150.0" y="210.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#DCE9F5" text-anchor="end" font-weight="700" xml:space="preserve" >2026</text><rect x="170" y="180" width="600" height="44" rx="8" fill="#143556" stroke="#1B3F66" stroke-width="1" /><rect x="170" y="180" width="515" height="44" rx="8" fill="#6FE3B4"><animate attributeName="width" values="0;515;515" keyTimes="0;0.35;1" dur="7s" begin="0.6s" fill="freeze"/></rect><text x="704.8" y="210.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#DCE9F5" text-anchor="start" font-weight="700" xml:space="preserve" >85.8%</text><text x="170.0" y="280.0"